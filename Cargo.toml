[workspace]
members = ["crates/fleet-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
license = "Apache-2.0"
repository = "https://github.com/mbianchidev/sendbox-fleet"
publish = false

[workspace.dependencies]
actix-http = { version = "3.21.0", default-features = false }
actix-web = { version = "4.19.0", default-features = false, features = ["macros"] }
sendbox-governance = { git = "https://github.com/mbianchidev/sendbox", rev = "bd7498ab24c3c9cfd98f80349bee31fed667539b" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "sqlite", "tls-rustls"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.47"
tokio = { version = "1.54.1", features = ["rt", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
