[workspace]
members = ["crates/fleet-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
repository = "https://github.com/mbianchidev/sendbox-fleet"
publish = false

[workspace.dependencies]
actix-http = { version = "3.21.0", default-features = false }
actix-web = { version = "4.19.0", default-features = false, features = ["macros"] }
base64 = "0.22.1"
clap = { version = "4.6.2", features = ["derive"] }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
sendbox-governance = { git = "https://github.com/mbianchidev/sendbox", branch = "main" }
sendbox-security = { git = "https://github.com/mbianchidev/sendbox", branch = "main" }
serde_json_canonicalizer = "0.3.2"
serde_yaml_ng = { package = "yaml_serde", version = "0.10.7" }
sha2 = "0.11.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "sqlite-bundled", "tls-rustls"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.47"
tokio = { version = "1.54.1", features = ["rt", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
zeroize = "1.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
