# cargo-audit configuration. Every ignored advisory needs a reason and an exit
# condition; revisit them whenever dependencies or the toolchain change.
[advisories]
ignore = [
    # libsqlite3-sys bundles SQLite older than the fix (stale page-cache bytes
    # when an attacker-written database and -wal file are opened together).
    # The fix is libsqlite3-sys 0.39, but sqlx-sqlite 0.9.0 requires < 0.38, so
    # 0.37 is the newest usable release. SQLite is only used for local
    # development and tests, on files the service creates itself; production
    # uses PostgreSQL. Remove when an sqlx release allows libsqlite3-sys 0.39.
    "RUSTSEC-2026-0459",
]
